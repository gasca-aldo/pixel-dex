name: Database backup (cloud)
on:
  workflow_dispatch:
  # Enable only after manual cloud backup + download validation pass:
  # schedule:
  #   - cron: '0 9 * * *'
  #     timezone: America/Tijuana
permissions:
  contents: read
concurrency:
  group: pixel-dex-database-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: database-backup
    steps:
      - name: Verify manual-run safety configuration
        env:
          CONFIGURED: ${{ vars.BACKUP_CONFIGURED }}
          RETENTION: ${{ vars.BACKUP_RETENTION_ENABLED }}
          CAP: ${{ vars.R2_MAX_BACKUP_BYTES }}
        run: |
          test "$CONFIGURED" = true || { echo 'Backup configuration is not verified'; exit 1; }
          test "$RETENTION" = false || { echo 'Retention must remain disabled'; exit 1; }
          test "$CAP" = 5000000000 || { echo 'Storage cap must equal 5000000000'; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.19.0'
      - name: Install dedicated backup dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/backup-tools" supabase@2.117.0 --no-audit --no-fund
          python3 -m venv "$RUNNER_TEMP/backup-python"
          "$RUNNER_TEMP/backup-python/bin/pip" install boto3==1.40.0
      - name: Offline tests
        run: python3 -m unittest discover -s scripts/backup -p 'test_*.py'
      - name: Backup, encrypt and verify R2 readback
        env:
          SUPABASE_BIN: ${{ runner.temp }}/backup-tools/node_modules/.bin/supabase
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_KEY_B64: ${{ secrets.BACKUP_KEY_B64 }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_MAX_BACKUP_BYTES: ${{ vars.R2_MAX_BACKUP_BYTES || '5000000000' }}
          DO_NOT_TRACK: '1'
        run: |
          set -eu
          umask 077
          "$RUNNER_TEMP/backup-python/bin/python" scripts/backup/cloud_backup.py
